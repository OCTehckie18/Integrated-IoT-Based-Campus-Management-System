; PlatformIO fallback for when the Wokwi web editor does not work (or for a real ESP32 later).
; Build:  pio run        Then simulate with the Wokwi VS Code extension (F1 > "Wokwi: Start Simulator").
; Library versions below resolved and built successfully on this machine (Blynk 1.4.0 seen at runtime, DHT sensor library for ESPx 1.19).
[platformio]
default_envs = esp32dev      ; the Build button / `pio run` builds only the product firmware

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<dhttest.cpp>
lib_deps =
    blynkkk/Blynk @ ^1.3.2
    beegee-tokyo/DHT sensor library for ESPx @ ^1.19

; ---- DHT22 diagnostics (not product firmware). Build with:  pio run -e dhttest   /   pio run -e dhttest_wifi
; Run in Wokwi with the matching config: F1 > "Wokwi: Select Config File" > wokwi-dhttest.toml / wokwi-dhttest-wifi.toml
[env:dhttest]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<dhttest.cpp>
lib_deps =
    beegee-tokyo/DHT sensor library for ESPx @ ^1.19

[env:dhttest_wifi]
extends = env:dhttest
build_flags = -DTEST_WIFI
